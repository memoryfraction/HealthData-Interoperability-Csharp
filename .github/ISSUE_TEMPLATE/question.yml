name: 💬 Question / help
description: Not sure how to use something, or need help integrating it?
title: "[Question] "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste real patient data (PHI)** — use synthetic or redacted examples only.
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What are you trying to do, and where are you stuck?
    validations:
      required: true
