name: 🐞 Bug report
description: Something in HealthData.Interop.* is broken or behaves unexpectedly.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Do not paste real patient data (PHI)** — use synthetic or redacted examples only.
  - type: input
    id: package
    attributes:
      label: Package and version
      placeholder: "HealthData.Interop.Fhir 1.4.3"
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: .NET version / OS
      placeholder: ".NET 10, Windows 11"
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead? Include error messages or stack traces.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal code or steps. A synthetic FHIR resource (JSON) helps a lot.
      render: csharp
