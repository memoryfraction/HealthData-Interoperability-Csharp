# ============================================================================
# HealthData.Interop NuGet — automated release via Trusted Publishing (OIDC)
#
# No API key. No secret in the repo.
#
# How it works:
#   1. `permissions: id-token: write` tells GitHub to mint a short-lived
#      OIDC JWT (audience: vcp.nuget.org) into the ACTIONS_ID_TOKEN
#      environment variable.
#   2. We pass that JWT as `--api-key` to `dotnet nuget push`.
#   3. nuget.org validates the JWT against our Trusted Publishing policy
#      (owner: rong.fan, repo: memoryfraction/HealthData-Interoperability-
#      Csharp, workflow: nuget-publish.yml, glob: HealthData.Interop.*).
#
# One-time nuget.org setup (already done ✓):
#   nuget.org -> Account -> Trusted Publishing -> "HealthData" policy
#
# Every release is just:
#     git tag v1.5.0 && git push origin v1.5.0
# ============================================================================

name: NuGet Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  # Required for Trusted Publishing: lets Actions mint an OIDC JWT
  # that nuget.org accepts in place of an API key.
  id-token: write
  contents: read

concurrency:
  group: nuget-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  NUGET_XMLDOC_MODE: skip

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore HealthData.Interop.slnx

      - name: Build
        run: dotnet build HealthData.Interop.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test src/tests/HealthData.Interop.Tests.csproj --configuration Release --no-build

      - name: Pack
        run: |
          mkdir -p dist
          dotnet pack src/Abstractions/HealthData.Interop.Abstractions/HealthData.Interop.Abstractions.csproj --configuration Release --no-build -o dist
          dotnet pack src/Logging.Extensions/HealthData.Interop.Logging.Extensions/HealthData.Interop.Logging.Extensions.csproj --configuration Release --no-build -o dist
          dotnet pack src/Logging.Serilog/HealthData.Interop.Logging.Serilog/HealthData.Interop.Logging.Serilog.csproj --configuration Release --no-build -o dist
          dotnet pack src/HealthData.Interop.Fhir/HealthDataInteropSharedLibrary.csproj --configuration Release --no-build -o dist

      - name: List packages
        run: ls -la dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nupkgs
          path: dist/
          retention-days: 7

  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: nupkgs
          path: dist/

      - name: Install .NET SDK (for dotnet nuget push)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Push all packages to nuget.org (Trusted Publishing, no key)
        env:
          # GitHub Actions provides this OIDC JWT because of
          # `permissions: id-token: write`. It is short-lived (~5 min)
          # and scoped to audience vcp.nuget.org.
          OIDC_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$OIDC_TOKEN" ]; then
            echo "ERROR: OIDC token not available. Ensure 'permissions: id-token: write' is set."
            exit 1
          fi

          # Verify the token looks like a JWT
          if [[ ! "$OIDC_TOKEN" =~ ^eyJ.*\..*\. ]] && [[ ! "$OIDC_TOKEN" =~ ^\{.*"access_token" ]]; then
            echo "WARNING: OIDC token does not look like a standard JWT. Attempting push anyway..."
          fi

          for pkg in dist/*.nupkg dist/*.snupkg; do
            echo "==> Pushing: $pkg"
            dotnet nuget push "$pkg" \
              --source https://api.nuget.org/v3/index.json \
              --api-key "$OIDC_TOKEN" \
              --skip-duplicate
          done

          echo "==> All packages pushed successfully via Trusted Publishing."
