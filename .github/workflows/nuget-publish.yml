# ============================================================================
# HealthData.Interop NuGet — automated release
#
# Trigger: git tag v1.5.0 && git push origin v1.5.0
#
# Auth: Uses NUGET_API_KEY from repo Secrets (not in the repo).
#   1. Go to: https://www.nuget.org/profiles/rong.fan
#   2. Click "Generate API Key" (or copy existing)
#   3. Go to: https://github.com/memoryfraction/HealthData-Interoperability-Csharp/settings/secrets/actions/new
#   4. Name: NUGET_API_KEY
#   5. Value: <your nuget.org API key>
#   6. Add → Done.
#
# The API key is referenced at runtime via ${{ secrets.NUGET_API_KEY }} —
# it is never stored in the repo, never logged, and only visible in the
# Actions run log as a redacted [command] line.
# ============================================================================

name: NuGet Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nuget-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  NUGET_XMLDOC_MODE: skip

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore HealthData.Interop.slnx

      - name: Build
        run: dotnet build HealthData.Interop.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test src/tests/HealthData.Interop.Tests.csproj --configuration Release --no-build

      - name: Pack
        run: |
          mkdir -p dist
          dotnet pack src/Abstractions/HealthData.Interop.Abstractions/HealthData.Interop.Abstractions.csproj --configuration Release --no-build -o dist
          dotnet pack src/Logging.Extensions/HealthData.Interop.Logging.Extensions/HealthData.Interop.Logging.Extensions.csproj --configuration Release --no-build -o dist
          dotnet pack src/Logging.Serilog/HealthData.Interop.Logging.Serilog/HealthData.Interop.Logging.Serilog.csproj --configuration Release --no-build -o dist
          dotnet pack src/HealthData.Interop.Fhir/HealthDataInteropSharedLibrary.csproj --configuration Release --no-build -o dist

      - name: List packages
        run: ls -la dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nupkgs
          path: dist/
          retention-days: 7

  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: nupkgs
          path: dist/

      - name: Install .NET SDK (for dotnet nuget push)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Push all packages to nuget.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "ERROR: NUGET_API_KEY secret is not set."
            echo "Go to: https://github.com/memoryfraction/HealthData-Interoperability-Csharp/settings/secrets/actions/new"
            echo "Name: NUGET_API_KEY"
            echo "Value: your nuget.org API key (from https://www.nuget.org/profiles/rong.fan)"
            exit 1
          fi
          for pkg in dist/*.nupkg dist/*.snupkg; do
            echo "==> Pushing: $pkg"
            dotnet nuget push "$pkg" \
              --source https://api.nuget.org/v3/index.json \
              --api-key "$NUGET_API_KEY" \
              --skip-duplicate
          done
          echo "==> All packages pushed successfully."
