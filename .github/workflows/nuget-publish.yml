name: NuGet Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: nuget-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  NUGET_XMLDOC_MODE: skip

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore HealthData.Interop.slnx

      - name: Build
        run: dotnet build HealthData.Interop.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test src/tests/HealthData.Interop.Tests.csproj --configuration Release --no-build

      - name: Pack
        run: |
          mkdir -p dist
          dotnet pack src/Abstractions/HealthData.Interop.Abstractions/HealthData.Interop.Abstractions.csproj --configuration Release --no-build -o dist
          dotnet pack src/Logging.Extensions/HealthData.Interop.Logging.Extensions/HealthData.Interop.Logging.Extensions.csproj --configuration Release --no-build -o dist
          dotnet pack src/Logging.Serilog/HealthData.Interop.Logging.Serilog/HealthData.Interop.Logging.Serilog.csproj --configuration Release --no-build -o dist
          dotnet pack src/HealthData.Interop.Fhir/HealthDataInteropSharedLibrary.csproj --configuration Release --no-build -o dist

      - name: List packages
        run: ls -la dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nupkgs
          path: dist/
          retention-days: 7

  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: nupkgs
          path: dist/

      - name: Push all packages to nuget.org (Trusted Publishing)
        run: |
          # 1. Mint OIDC JWT
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ] || [ -z "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
            echo "ERROR: OIDC env vars not set."
            exit 1
          fi
          JWT=$(curl -s -X POST "$ACTIONS_ID_TOKEN_REQUEST_URL" \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"audience":"vcp.nuget.org"}' | jq -r '.value')
          if [ -z "$JWT" ] || [ "$JWT" = "null" ]; then
            echo "ERROR: Could not mint OIDC JWT."
            exit 1
          fi
          echo "==> JWT minted (length: ${#JWT})"

          # 2. Push each package using curl with Bearer token
          for pkg in dist/*.nupkg dist/*.snupkg; do
            echo "==> Pushing: $pkg"
            FILENAME=$(basename "$pkg")
            RESPONSE=$(curl -s -w "\n%{http_code}" -X PUT \
              "https://api.nuget.org/v3-index/package" \
              -H "Authorization: Bearer $JWT" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$pkg")
            HTTP_CODE=$(echo "$RESPONSE" | tail -1)
            BODY=$(echo "$RESPONSE" | sed '$d')
            echo "  HTTP $HTTP_CODE: $BODY"
            if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "201" ] && [ "$HTTP_CODE" != "204" ]; then
              echo "ERROR: Push failed with HTTP $HTTP_CODE"
              exit 1
            fi
          done
          echo "==> All packages pushed successfully."
