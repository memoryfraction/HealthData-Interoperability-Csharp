# ============================================================================
# HealthData.Interop NuGet — automated release via Trusted Publishing (OIDC)
#
# No API key. No secret in the repo. GitHub Actions exchanges a short-lived
# OIDC token with nuget.org at publish time (nuget.org Trusted Publishing).
#
# One-time setup (done ONCE in the nuget.org web UI, NOT in this repo):
#   nuget.org -> Account -> Trusted Publishing -> "Add a policy":
#     Policy Name:        HealthData (any name you like)
#     Package Owner:      rong.fan
#     CI/CD Provider:     GitHub Actions
#     Repository Owner:   memoryfraction
#     Repository:         HealthData-Interoperability-Csharp
#     Workflow File:      nuget-publish.yml
#     Environment:        (leave blank)
#     Scopes:             Push -> "Push new packages and package versions"
#     Glob Patterns:      HealthData.Interop.*
#
# After that, every release is just:
#     git tag v1.5.0 && git push origin v1.5.0
# ============================================================================

name: NuGet Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  # Required for Trusted Publishing: lets Actions mint a JWT that nuget.org accepts.
  id-token: write
  contents: read

concurrency:
  group: nuget-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  NUGET_XMLDOC_MODE: skip

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore HealthData.Interop.slnx

      - name: Build
        run: dotnet build HealthData.Interop.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test src/tests/HealthData.Interop.Tests.csproj --configuration Release --no-build

      - name: Pack
        run: |
          mkdir -p dist
          dotnet pack src/Abstractions/HealthData.Interop.Abstractions/HealthData.Interop.Abstractions.csproj --configuration Release --no-build -o dist
          dotnet pack src/Logging.Extensions/HealthData.Interop.Logging.Extensions/HealthData.Interop.Logging.Extensions.csproj --configuration Release --no-build -o dist
          dotnet pack src/Logging.Serilog/HealthData.Interop.Logging.Serilog/HealthData.Interop.Logging.Serilog.csproj --configuration Release --no-build -o dist
          dotnet pack src/HealthData.Interop.Fhir/HealthDataInteropSharedLibrary.csproj --configuration Release --no-build -o dist

      - name: List packages
        run: ls -la dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nupkgs
          path: dist/
          retention-days: 7

  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # No secrets used here. `dotnet nuget push` detects the Actions environment
    # and automatically authenticates via Trusted Publishing (OIDC).
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: nupkgs
          path: dist/

      - name: Install .NET SDK (for dotnet nuget push)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Push all packages to nuget.org (Trusted Publishing, no key)
        run: |
          for pkg in dist/*.nupkg dist/*.snupkg; do
            echo "==> Pushing: $pkg"
            dotnet nuget push "$pkg" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
