# ============================================================================
# HealthData.Interop NuGet — automated release via Trusted Publishing (OIDC)
#
# No API key. No secret in the repo.
#
# How it works:
#   1. `permissions: id-token: write` tells GitHub to make the OIDC token
#      endpoint available (ACTIONS_ID_TOKEN_REQUEST_URL + _TOKEN env vars).
#   2. We POST to that endpoint to mint a short-lived JWT (audience:
#      vcp.nuget.org) — this is the actual Trusted Publishing credential.
#   3. We pass that JWT as --api-key to `dotnet nuget push`.
#   4. nuget.org validates the JWT against our Trusted Publishing policy
#      (owner: rong.fan, repo: memoryfraction/HealthData-Interoperability-
#      Csharp, workflow: nuget-publish.yml, glob: HealthData.Interop.*).
#
# One-time nuget.org setup (already done ✓):
#   nuget.org -> Account -> Trusted Publishing -> "HealthData" policy
#
# Every release is just:
#     git tag v1.5.0 && git push origin v1.5.0
# ============================================================================

name: NuGet Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  # Required for Trusted Publishing: enables the OIDC token endpoint.
  id-token: write
  contents: read

concurrency:
  group: nuget-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  NUGET_XMLDOC_MODE: skip

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore HealthData.Interop.slnx

      - name: Build
        run: dotnet build HealthData.Interop.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test src/tests/HealthData.Interop.Tests.csproj --configuration Release --no-build

      - name: Pack
        run: |
          mkdir -p dist
          dotnet pack src/Abstractions/HealthData.Interop.Abstractions/HealthData.Interop.Abstractions.csproj --configuration Release --no-build -o dist
          dotnet pack src/Logging.Extensions/HealthData.Interop.Logging.Extensions/HealthData.Interop.Logging.Extensions.csproj --configuration Release --no-build -o dist
          dotnet pack src/Logging.Serilog/HealthData.Interop.Logging.Serilog/HealthData.Interop.Logging.Serilog.csproj --configuration Release --no-build -o dist
          dotnet pack src/HealthData.Interop.Fhir/HealthDataInteropSharedLibrary.csproj --configuration Release --no-build -o dist

      - name: List packages
        run: ls -la dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nupkgs
          path: dist/
          retention-days: 7

  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: nupkgs
          path: dist/

      - name: Install .NET SDK (for dotnet nuget push)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Mint OIDC JWT for Trusted Publishing
        id: oidc
        env:
          REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
          REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
        run: |
          if [ -z "$REQUEST_URL" ] || [ -z "$REQUEST_TOKEN" ]; then
            echo "ERROR: ACTIONS_ID_TOKEN_REQUEST_URL or ACTIONS_ID_TOKEN_REQUEST_TOKEN is not set."
            echo "Ensure the workflow has: permissions: id-token: write"
            exit 1
          fi
          echo "==> Requesting OIDC token from $REQUEST_URL"
          RESPONSE=$(curl -s -X POST "$REQUEST_URL" \
            -H "Authorization: bearer $REQUEST_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"audience":"vcp.nuget.org"}')
          echo "==> Response: $RESPONSE"
          JWT=$(echo "$RESPONSE" | jq -r '.value // empty')
          if [ -z "$JWT" ]; then
            echo "ERROR: Could not extract JWT from response."
            echo "Full response: $RESPONSE"
            exit 1
          fi
          echo "==> JWT received (length: ${#JWT})"
          echo "jwt=$JWT" >> "$GITHUB_OUTPUT"

      - name: Push all packages to nuget.org (Trusted Publishing)
        env:
          NUGET_OIDC_JWT: ${{ steps.oidc.outputs.jwt }}
        run: |
          if [ -z "$NUGET_OIDC_JWT" ]; then
            echo "ERROR: NUGET_OIDC_JWT is empty."
            exit 1
          fi
          for pkg in dist/*.nupkg dist/*.snupkg; do
            echo "==> Pushing: $pkg"
            dotnet nuget push "$pkg" \
              --source https://api.nuget.org/v3/index.json \
              --api-key "$NUGET_OIDC_JWT" \
              --skip-duplicate
          done
          echo "==> All packages pushed successfully via Trusted Publishing."
